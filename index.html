<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>神魔之塔风格 公会任务分数计算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background:
        radial-gradient(circle at top, rgba(120, 53, 15, 0.18), transparent 24%),
        radial-gradient(circle at 20% 10%, rgba(109, 40, 217, 0.14), transparent 24%),
        linear-gradient(180deg, #07080d 0%, #0c1220 50%, #0a0f1b 100%);
      color: #f8fafc;
      min-height: 100vh;
    }

    .panel {
      border: 1px solid rgba(212, 175, 55, 0.20);
      background: linear-gradient(180deg, rgba(10, 12, 22, 0.94) 0%, rgba(16, 22, 36, 0.90) 100%);
      box-shadow: 0 16px 36px rgba(0,0,0,0.42);
    }

    .title-panel {
      border: 1px solid rgba(212, 175, 55, 0.24);
      background: linear-gradient(135deg, rgba(212,175,55,0.08), rgba(109,40,217,0.08));
      box-shadow: 0 18px 40px rgba(0,0,0,0.45);
    }

    .input {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(212, 175, 55, 0.18);
      background: rgba(7, 10, 18, 0.96);
      color: #fff;
      padding: 12px 14px;
      outline: none;
    }

    .input:focus {
      border-color: rgba(245, 208, 94, 0.65);
      box-shadow: 0 0 0 3px rgba(245, 208, 94, 0.10);
    }

    .btn {
      border-radius: 14px;
      padding: 14px 16px;
      font-weight: 800;
      border: 1px solid rgba(212,175,55,0.18);
      cursor: pointer;
      transition: 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .btn-gold {
      background: linear-gradient(180deg, rgba(212,175,55,0.20), rgba(120, 53, 15, 0.16));
      color: #fef3c7;
    }

    .btn-violet {
      background: linear-gradient(180deg, rgba(109,40,217,0.24), rgba(67,56,202,0.16));
      color: #ede9fe;
      border-color: rgba(167,139,250,0.20);
    }

    .btn-blue {
      background: linear-gradient(180deg, rgba(37,99,235,0.18), rgba(30,64,175,0.14));
      color: #dbeafe;
      border-color: rgba(96,165,250,0.18);
    }

    .btn-red {
      background: linear-gradient(180deg, rgba(185,28,28,0.22), rgba(127,29,29,0.14));
      color: #fee2e2;
      border-color: rgba(252,165,165,0.18);
      padding: 8px 12px;
      font-size: 14px;
    }

    .tag {
      display: inline-flex;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      background: rgba(212,175,55,0.12);
      border: 1px solid rgba(245,208,94,0.18);
      color: #f5d05e;
    }

    .metric {
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      border-radius: 18px;
      padding: 16px;
    }

    .progress-wrap {
      height: 14px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.98);
      overflow: hidden;
      border: 1px solid rgba(212,175,55,0.10);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #d4af37, #f5d05e, #8b5cf6);
      transition: width 0.25s ease;
    }

    .record-card {
      border: 1px solid rgba(212,175,55,0.10);
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      padding: 14px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="max-w-4xl mx-auto px-4 py-8 md:px-6">
    <div class="title-panel rounded-[24px] p-6 md:p-8 mb-6">
      <div class="flex items-start justify-between gap-4">
        <div>
          <div class="tag mb-3">Tower of Saviors Style</div>
          <h1 class="text-3xl md:text-4xl font-black text-yellow-100 tracking-wide">公会任务分数计算器</h1>
          <p class="mt-3 text-sm md:text-base text-slate-300 leading-7">
            极简版。主页面只保留普通与特别两个按钮，其余项目都放进设置。
          </p>
        </div>
        <button id="openSettingsBtn" class="btn btn-blue">设置</button>
      </div>
    </div>

    <div id="settingsPanel" class="panel rounded-3xl p-5 md:p-6 mb-6 hidden">
      <div class="flex items-center justify-between gap-3 mb-4">
        <h2 class="text-lg font-bold text-yellow-100">设置</h2>
        <button id="closeSettingsBtn" class="btn btn-blue">关闭</button>
      </div>

      <div class="grid gap-4 md:grid-cols-2">
        <div>
          <label class="block text-sm font-semibold text-slate-300 mb-2">目标分数</label>
          <input id="target" class="input" type="number" min="0" value="20000" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-300 mb-2">目前已有分数</label>
          <input id="initialCurrent" class="input" type="number" min="0" value="0" />
        </div>
      </div>

      <div class="mt-5 grid gap-3 grid-cols-2">
        <button id="startBtn" class="btn btn-gold">开始</button>
        <button id="resetAllBtn" class="btn btn-blue">重置</button>
      </div>

      <div class="mt-5 rounded-2xl border border-yellow-400/10 bg-white/5 p-4 text-sm text-slate-400 leading-7">
        - 目标分数预设 20000，可手动修改<br>
        - 普通奖励固定 40 分<br>
        - 特别奖励固定 200 分<br>
        - 尚需体力按普通奖励 40 分推算
      </div>
    </div>

    <section class="panel rounded-3xl p-5 md:p-6">
      <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4 mb-5">
        <div class="metric">
          <div class="text-sm text-slate-400">目前总分</div>
          <div id="currentDisplay" class="mt-2 text-3xl font-black text-yellow-50">0</div>
        </div>
        <div class="metric">
          <div class="text-sm text-slate-400">距离目标</div>
          <div id="remainingDisplay" class="mt-2 text-3xl font-black text-cyan-50">0</div>
        </div>
        <div class="metric">
          <div class="text-sm text-slate-400">尚需体力</div>
          <div id="staminaDisplay" class="mt-2 text-3xl font-black text-violet-50">0</div>
        </div>
        <div class="metric">
          <div class="text-sm text-slate-400">普通还要几次</div>
          <div id="normalRunsDisplay" class="mt-2 text-3xl font-black text-emerald-50">0</div>
        </div>
      </div>

      <div class="mb-5">
        <div class="mb-2 flex items-center justify-between text-sm text-slate-300">
          <span>完成进度</span>
          <span id="progressText">0%</span>
        </div>
        <div class="progress-wrap">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <div id="statusText" class="mt-3 text-sm text-slate-400"></div>
      </div>

      <div class="grid gap-3 grid-cols-2">
        <button id="addNormalBtn" class="btn btn-gold">普通 +40</button>
        <button id="addSpecialBtn" class="btn btn-violet">特别 +200</button>
      </div>
    </section>

    <section class="panel rounded-3xl p-5 md:p-6 mt-6">
      <div class="mb-4 flex items-center justify-between gap-3">
        <h2 class="text-lg font-bold text-yellow-100">记录历史</h2>
        <div id="historyCount" class="text-sm text-slate-400">共 0 笔记录</div>
      </div>
      <div id="historyWrap"></div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'tos-guild-score-tracker-v5';
    const NORMAL_SCORE = 40;
    const SPECIAL_SCORE = 200;
    const STAMINA_PER_RUN = 40;

    const el = {
      target: document.getElementById('target'),
      initialCurrent: document.getElementById('initialCurrent'),
      currentDisplay: document.getElementById('currentDisplay'),
      remainingDisplay: document.getElementById('remainingDisplay'),
      staminaDisplay: document.getElementById('staminaDisplay'),
      normalRunsDisplay: document.getElementById('normalRunsDisplay'),
      progressText: document.getElementById('progressText'),
      progressBar: document.getElementById('progressBar'),
      statusText: document.getElementById('statusText'),
      addNormalBtn: document.getElementById('addNormalBtn'),
      addSpecialBtn: document.getElementById('addSpecialBtn'),
      startBtn: document.getElementById('startBtn'),
      resetAllBtn: document.getElementById('resetAllBtn'),
      historyCount: document.getElementById('historyCount'),
      historyWrap: document.getElementById('historyWrap'),
      openSettingsBtn: document.getElementById('openSettingsBtn'),
      closeSettingsBtn: document.getElementById('closeSettingsBtn'),
      settingsPanel: document.getElementById('settingsPanel')
    };

    let state = loadState();

    function defaultState() {
      return {
        target: 20000,
        initialCurrent: 0,
        started: false,
        settingsOpen: false,
        history: []
      };
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return defaultState();
        return { ...defaultState(), ...JSON.parse(saved) };
      } catch {
        return defaultState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function nowText() {
      const d = new Date();
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function getExtraScore() {
      return state.history.reduce((sum, item) => sum + Number(item.score || 0), 0);
    }

    function getCurrentTotal() {
      return Number(state.initialCurrent || 0) + getExtraScore();
    }

    function openSettings() {
      state.settingsOpen = true;
      saveState();
      renderSettings();
    }

    function closeSettings() {
      state.settingsOpen = false;
      saveState();
      renderSettings();
    }

    function renderSettings() {
      if (state.settingsOpen) el.settingsPanel.classList.remove('hidden');
      else el.settingsPanel.classList.add('hidden');
    }

    function startTracking() {
      state.target = Math.max(0, Number(el.target.value) || 0);
      state.initialCurrent = Math.max(0, Number(el.initialCurrent.value) || 0);
      state.started = true;
      saveState();
      render();
      closeSettings();
      alert('已开始记录');
    }

    function addScore(type) {
      if (!state.started) {
        openSettings();
        alert('请先在设置里输入目前分数后按开始');
        return;
      }

      const score = type === 'normal' ? NORMAL_SCORE : SPECIAL_SCORE;
      const typeLabel = type === 'normal' ? '普通任务' : '特别任务';

      state.history.unshift({
        id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        time: nowText(),
        type,
        typeLabel,
        score
      });

      saveState();
      render();
    }

    function deleteLog(id) {
      state.history = state.history.filter(item => item.id !== id);
      saveState();
      render();
    }

    function resetAll() {
      if (!confirm('确定要重置全部资料吗？')) return;
      state = defaultState();
      saveState();
      fillInputs();
      renderSettings();
      render();
    }

    function fillInputs() {
      el.target.value = state.target;
      el.initialCurrent.value = state.initialCurrent;
    }

    function renderHistory() {
      el.historyCount.textContent = `共 ${state.history.length} 笔记录`;

      if (!state.history.length) {
        el.historyWrap.innerHTML = `
          <div class="rounded-2xl border border-dashed border-white/10 bg-white/5 p-5 text-sm text-slate-400">
            目前还没有记录。
          </div>
        `;
        return;
      }

      el.historyWrap.innerHTML = state.history.map((item, index) => `
        <div class="record-card mb-3">
          <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
            <div>
              <div class="text-sm text-slate-500">#${state.history.length - index} ・ ${item.time}</div>
              <div class="mt-1 text-base font-bold text-yellow-100">+${item.score} 分 ・ ${item.typeLabel}</div>
            </div>
            <button class="btn btn-red" onclick="deleteLog('${item.id}')">删除</button>
          </div>
        </div>
      `).join('');
    }

    function render() {
      const current = getCurrentTotal();
      const target = Math.max(0, Number(state.target) || 0);
      const remaining = Math.max(0, target - current);
      const progress = target === 0 ? 100 : Math.min(100, (current / target) * 100);
      const normalRuns = remaining === 0 ? 0 : Math.ceil(remaining / NORMAL_SCORE);
      const stamina = normalRuns * STAMINA_PER_RUN;

      el.currentDisplay.textContent = current.toLocaleString();
      el.remainingDisplay.textContent = remaining.toLocaleString();
      el.staminaDisplay.textContent = stamina.toLocaleString();
      el.normalRunsDisplay.textContent = normalRuns.toLocaleString();
      el.progressText.textContent = `${progress.toFixed(1)}%`;
      el.progressBar.style.width = `${progress}%`;

      if (!state.started) {
        el.statusText.textContent = '请先到设置里输入目前已有分数，然后按开始。';
      } else if (current >= target) {
        el.statusText.textContent = `已达标，目前 ${current.toLocaleString()} 分。`;
      } else {
        el.statusText.textContent = `距离目标还差 ${remaining.toLocaleString()} 分，按普通奖励 40 分推算，还需要 ${normalRuns.toLocaleString()} 次，约 ${stamina.toLocaleString()} 体力。`;
      }

      renderHistory();
    }

    window.deleteLog = deleteLog;

    el.startBtn.addEventListener('click', startTracking);
    el.addNormalBtn.addEventListener('click', () => addScore('normal'));
    el.addSpecialBtn.addEventListener('click', () => addScore('special'));
    el.resetAllBtn.addEventListener('click', resetAll);
    el.openSettingsBtn.addEventListener('click', openSettings);
    el.closeSettingsBtn.addEventListener('click', closeSettings);

    el.target.addEventListener('input', () => {
      state.target = Math.max(0, Number(el.target.value) || 0);
      saveState();
      render();
    });

    el.initialCurrent.addEventListener('input', () => {
      state.initialCurrent = Math.max(0, Number(el.initialCurrent.value) || 0);
      saveState();
      render();
    });

    fillInputs();
    renderSettings();
    render();
  </script>
</body>
</html>

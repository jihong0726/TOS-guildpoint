<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>公会分数</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --金: #d4af37;
      --亮金: #f5d05e;
      --紫: #8b5cf6;
      --蓝: #60a5fa;
      --底1: #07080d;
      --底2: #0c1220;
      --板: rgba(12, 16, 28, 0.92);
      --线: rgba(212, 175, 55, 0.18);
      --字: #f8fafc;
      --淡: #94a3b8;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--字);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background:
        radial-gradient(circle at top, rgba(212,175,55,0.10), transparent 24%),
        radial-gradient(circle at 20% 10%, rgba(139,92,246,0.12), transparent 24%),
        radial-gradient(circle at 80% 18%, rgba(59,130,246,0.08), transparent 20%),
        linear-gradient(180deg, var(--底1) 0%, var(--底2) 45%, #0a0f1b 100%);
    }

    .wrap {
      max-width: 440px;
      margin: 0 auto;
      padding: 14px 12px 24px;
    }

    .hero {
      position: relative;
      border-radius: 24px;
      padding: 16px;
      border: 1px solid rgba(212,175,55,0.22);
      background:
        linear-gradient(180deg, rgba(17,23,39,0.96), rgba(10,14,24,0.94)),
        linear-gradient(135deg, rgba(212,175,55,0.06), rgba(139,92,246,0.06));
      box-shadow: 0 20px 44px rgba(0,0,0,0.40), inset 0 1px 0 rgba(255,255,255,0.03);
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(245,208,94,0.08), transparent 40%, rgba(139,92,246,0.10));
    }

    .页签 {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(245,208,94,0.16);
      background: rgba(212,175,55,0.10);
      color: var(--亮金);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .标题 {
      margin: 10px 0 0;
      font-size: 28px;
      font-weight: 900;
      color: #fef3c7;
      letter-spacing: 0.03em;
    }

    .副文 {
      margin: 8px 0 0;
      color: var(--淡);
      font-size: 13px;
      line-height: 1.7;
    }

    .设置按钮 {
      position: absolute;
      top: 14px;
      right: 14px;
      min-width: 64px;
      height: 38px;
      border: 1px solid rgba(96,165,250,0.18);
      background: linear-gradient(180deg, rgba(37,99,235,0.18), rgba(30,64,175,0.12));
      color: #dbeafe;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .卡 {
      margin-top: 12px;
      border-radius: 22px;
      border: 1px solid var(--线);
      background: linear-gradient(180deg, rgba(10,12,22,0.95), rgba(13,18,31,0.92));
      box-shadow: 0 14px 34px rgba(0,0,0,0.34);
      padding: 14px;
    }

    .设置区 { display: none; }
    .设置区.show { display: block; }

    .区标题 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 800;
      color: #fef3c7;
    }

    .标签 {
      display: block;
      margin: 0 0 8px;
      font-size: 13px;
      color: var(--淡);
      font-weight: 700;
    }

    .输入框 {
      width: 100%;
      border: 1px solid rgba(212,175,55,0.16);
      background: rgba(7,10,18,0.96);
      color: #fff;
      border-radius: 14px;
      padding: 12px 14px;
      outline: none;
      font-size: 15px;
    }

    .输入框:focus {
      border-color: rgba(245,208,94,0.55);
      box-shadow: 0 0 0 3px rgba(245,208,94,0.08);
    }

    .双列 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .按钮 {
      border: 1px solid rgba(212,175,55,0.16);
      border-radius: 14px;
      min-height: 50px;
      padding: 12px 14px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .18s ease, filter .18s ease;
    }

    .按钮:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .按钮:active { transform: translateY(0); }

    .金按钮 {
      background: linear-gradient(180deg, rgba(212,175,55,0.22), rgba(120,53,15,0.14));
      color: #fef3c7;
    }

    .紫按钮 {
      background: linear-gradient(180deg, rgba(109,40,217,0.26), rgba(67,56,202,0.14));
      color: #ede9fe;
      border-color: rgba(167,139,250,0.18);
    }

    .蓝按钮 {
      background: linear-gradient(180deg, rgba(37,99,235,0.18), rgba(30,64,175,0.12));
      color: #dbeafe;
      border-color: rgba(96,165,250,0.16);
    }

    .红按钮 {
      background: linear-gradient(180deg, rgba(185,28,28,0.22), rgba(127,29,29,0.12));
      color: #fee2e2;
      border-color: rgba(252,165,165,0.16);
      min-height: 38px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 800;
    }

    .主分区 {
      text-align: center;
      padding: 16px 12px 14px;
    }

    .主标签 {
      font-size: 13px;
      color: var(--淡);
    }

    .主分数 {
      margin-top: 8px;
      font-size: 50px;
      line-height: 1;
      font-weight: 900;
      color: #fff7d6;
      letter-spacing: 0.02em;
      text-shadow: 0 0 18px rgba(212,175,55,0.12);
    }

    .信息格 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .信息卡 {
      border: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
    }

    .信息标题 {
      display: block;
      font-size: 12px;
      color: var(--淡);
      margin-bottom: 6px;
    }

    .信息值 {
      font-size: 24px;
      font-weight: 900;
    }

    .进度槽 {
      margin-top: 14px;
      height: 14px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(15,23,42,0.98);
      border: 1px solid rgba(212,175,55,0.10);
    }

    .进度条 {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--金), var(--亮金), var(--紫));
      transition: width .24s ease;
    }

    .状态字 {
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      line-height: 1.7;
      color: var(--淡);
    }

    .操作区 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .操作按钮 {
      min-height: 96px;
      font-size: 22px;
      letter-spacing: 0.03em;
      line-height: 1.35;
    }

    .历史头 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .历史数量 {
      font-size: 12px;
      color: var(--淡);
    }

        .记录卡 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      border: 1px solid rgba(212,175,55,0.10);
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .记录主体 { min-width: 0; }
    .记录时间 { font-size: 12px; color: #64748b; }
    .记录分数 { margin-top: 5px; font-size: 15px; font-weight: 900; color: #fef3c7; }

    .记录列表 {
      max-height: 320px;
      overflow-y: auto;
      padding-right: 4px;
      scroll-behavior: smooth;
    }

    .记录列表::-webkit-scrollbar {
      width: 8px;
    }

    .记录列表::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.03);
      border-radius: 999px;
    }

    .记录列表::-webkit-scrollbar-thumb {
      background: rgba(212,175,55,0.28);
      border-radius: 999px;
    }

    .回顶按钮 {
      position: fixed;
      right: 16px;
      bottom: 20px;
      width: 48px;
      height: 48px;
      border-radius: 999px;
      border: 1px solid rgba(212,175,55,0.18);
      background: linear-gradient(180deg, rgba(212,175,55,0.22), rgba(120,53,15,0.14));
      color: #fef3c7;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,0.28);
      display: none;
      z-index: 20;
    }

    .回顶按钮.show {
      display: block;
    }

    .空状态 {
      border: 1px dashed rgba(255,255,255,0.10);
      border-radius: 16px;
      padding: 14px;
      color: var(--淡);
      font-size: 13px;
      text-align: center;
      background: rgba(255,255,255,0.03);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <button id="openSettingsBtn" class="设置按钮">设置</button>
      <div class="页签">公会积分</div>
      <h1 class="标题">公会积分</h1>
      <p class="副文">同一关卡，奖励随机。打完后按对应奖励记录即可。</p>
    </div>

    <section id="settingsPanel" class="卡 设置区">
      <div class="历史头">
        <h2 class="区标题" style="margin:0;">设置</h2>
        <button id="closeSettingsBtn" class="按钮 蓝按钮" style="min-height:38px;padding:8px 12px;">关闭</button>
      </div>

      <div>
        <label class="标签">目标分数</label>
        <input id="target" class="输入框" type="number" min="0" value="20000" />
      </div>

      <div style="margin-top:12px;">
        <label class="标签">目前已有分数</label>
        <input id="initialCurrent" class="输入框" type="number" min="0" value="0" />
      </div>

      <div class="双列" style="margin-top:12px;">
        <button id="startBtn" class="按钮 金按钮">开始</button>
        <button id="resetAllBtn" class="按钮 蓝按钮">重置</button>
      </div>

      <div class="状态字" style="text-align:left;margin-top:12px;">
        关卡只有一种。每次通关后，按本次拿到的奖励记录：普通奖励 40 分，特别奖励 200 分。尚需体力按普通奖励 40 分去推算。
      </div>
    </section>

    <section class="卡 主分区">
      <div class="主标签">目前总分</div>
      <div id="currentDisplay" class="主分数">0</div>

      <div class="信息格">
        <div class="信息卡">
          <span class="信息标题">距离目标</span>
          <strong id="remainingDisplay" class="信息值" style="color:#cffafe;">0</strong>
        </div>
        <div class="信息卡">
          <span class="信息标题">尚需体力</span>
          <strong id="staminaDisplay" class="信息值" style="color:#ede9fe;">0</strong>
        </div>
        <div class="信息卡">
          <span class="信息标题">普通奖励次数</span>
          <strong id="normalCountDisplay" class="信息值" style="color:#fef3c7;">0</strong>
        </div>
        <div class="信息卡">
          <span class="信息标题">特别奖励次数</span>
          <strong id="specialCountDisplay" class="信息值" style="color:#ede9fe;">0</strong>
        </div>
      </div>

      <div class="进度槽">
        <div id="progressBar" class="进度条"></div>
      </div>
      <div id="statusText" class="状态字"></div>

      <div class="操作区">
        <button id="addNormalBtn" class="按钮 金按钮 操作按钮">普通奖励<br>+40</button>
        <button id="addSpecialBtn" class="按钮 紫按钮 操作按钮">特别奖励<br>+200</button>
      </div>
    </section>

    <section class="卡">
      <div class="历史头">
        <h2 class="区标题" style="margin:0;">记录历史</h2>
        <div id="historyCount" class="历史数量">共 0 笔</div>
      </div>
      <div id="historyWrap" class="记录列表"></div>
    </section>

    <button id="backToTopBtn" class="回顶按钮" title="回到最上方">↑</button>
  </div>

  <script>
    const STORAGE_KEY = 'tos-guild-score-tracker-v7';
    const 普通分 = 40;
    const 特别分 = 200;
    const 每场体力 = 40;

    const el = {
      target: document.getElementById('target'),
      initialCurrent: document.getElementById('initialCurrent'),
      currentDisplay: document.getElementById('currentDisplay'),
      remainingDisplay: document.getElementById('remainingDisplay'),
      staminaDisplay: document.getElementById('staminaDisplay'),
      normalCountDisplay: document.getElementById('normalCountDisplay'),
      specialCountDisplay: document.getElementById('specialCountDisplay'),
      progressBar: document.getElementById('progressBar'),
      statusText: document.getElementById('statusText'),
      addNormalBtn: document.getElementById('addNormalBtn'),
      addSpecialBtn: document.getElementById('addSpecialBtn'),
      startBtn: document.getElementById('startBtn'),
      resetAllBtn: document.getElementById('resetAllBtn'),
      historyCount: document.getElementById('historyCount'),
      historyWrap: document.getElementById('historyWrap'),
      openSettingsBtn: document.getElementById('openSettingsBtn'),
      closeSettingsBtn: document.getElementById('closeSettingsBtn'),
      settingsPanel: document.getElementById('settingsPanel'),
      backToTopBtn: document.getElementById('backToTopBtn')
    };

    let state = 读取状态();

    function 默认状态() {
      return {
        target: 20000,
        initialCurrent: 0,
        started: false,
        settingsOpen: false,
        history: []
      };
    }

    function 读取状态() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return 默认状态();
        return { ...默认状态(), ...JSON.parse(saved) };
      } catch {
        return 默认状态();
      }
    }

    function 保存状态() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function 补零(n) {
      return String(n).padStart(2, '0');
    }

    function 现在时间() {
      const d = new Date();
      return `${d.getFullYear()}-${补零(d.getMonth() + 1)}-${补零(d.getDate())} ${补零(d.getHours())}:${补零(d.getMinutes())}:${补零(d.getSeconds())}`;
    }

    function 额外分数() {
      return state.history.reduce((sum, item) => sum + Number(item.score || 0), 0);
    }

    function 目前总分() {
      return Number(state.initialCurrent || 0) + 额外分数();
    }

    function 普通次数() {
      return state.history.filter(item => item.type === 'normal').length;
    }

    function 特别次数() {
      return state.history.filter(item => item.type === 'special').length;
    }

    function 打开设置() {
      state.settingsOpen = true;
      保存状态();
      渲染设置();
    }

    function 关闭设置() {
      state.settingsOpen = false;
      保存状态();
      渲染设置();
    }

    function 渲染设置() {
      if (state.settingsOpen) el.settingsPanel.classList.add('show');
      else el.settingsPanel.classList.remove('show');
    }

    function 开始记录() {
      state.target = Math.max(0, Number(el.target.value) || 0);
      state.initialCurrent = Math.max(0, Number(el.initialCurrent.value) || 0);
      state.started = true;
      保存状态();
      关闭设置();
      渲染();
      alert('已开始记录');
    }

    function 加分(type) {
      if (!state.started) {
        打开设置();
        alert('请先到设置里输入目前分数，再按开始');
        return;
      }

      const score = type === 'normal' ? 普通分 : 特别分;
      const typeLabel = type === 'normal' ? '普通奖励' : '特别奖励';

      state.history.unshift({
        id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        time: 现在时间(),
        type,
        typeLabel,
        score
      });

      保存状态();
      渲染();
    }

    function 删除记录(id) {
      state.history = state.history.filter(item => item.id !== id);
      保存状态();
      渲染();
    }

    function 重置全部() {
      if (!confirm('确定要重置全部资料吗？')) return;
      state = 默认状态();
      保存状态();
      填入设置值();
      渲染设置();
      渲染();
    }

    function 填入设置值() {
      el.target.value = state.target;
      el.initialCurrent.value = state.initialCurrent;
    }

    function 渲染记录() {
      el.historyCount.textContent = `共 ${state.history.length} 笔`;

      if (!state.history.length) {
        el.historyWrap.innerHTML = `<div class="空状态">目前还没有记录</div>`;
        return;
      }

      el.historyWrap.innerHTML = state.history.map((item, index) => `
        <div class="记录卡">
          <div class="记录主体">
            <div class="记录时间">#${state.history.length - index} ・ ${item.time}</div>
            <div class="记录分数">+${item.score} 分 ・ ${item.typeLabel}</div>
          </div>
          <button class="按钮 红按钮" onclick="删除记录('${item.id}')">删除</button>
        </div>
      `).join('');
    }

    function 渲染() {
      const current = 目前总分();
      const target = Math.max(0, Number(state.target) || 0);
      const remaining = Math.max(0, target - current);
      const progress = target === 0 ? 100 : Math.min(100, (current / target) * 100);
      const needNormalRuns = remaining === 0 ? 0 : Math.ceil(remaining / 普通分);
      const stamina = needNormalRuns * 每场体力;
      const normalCount = 普通次数();
      const specialCount = 特别次数();

      el.currentDisplay.textContent = current.toLocaleString();
      el.remainingDisplay.textContent = remaining.toLocaleString();
      el.staminaDisplay.textContent = stamina.toLocaleString();
      el.normalCountDisplay.textContent = normalCount.toLocaleString();
      el.specialCountDisplay.textContent = specialCount.toLocaleString();
      el.progressBar.style.width = `${progress}%`;

      if (!state.started) {
        el.statusText.textContent = '请先到设置里输入目前已有分数，然后按开始';
      } else if (current >= target) {
        el.statusText.textContent = `已达标，目前 ${current.toLocaleString()} 分`;
      } else {
        el.statusText.textContent = `还差 ${remaining.toLocaleString()} 分，还要 ${needNormalRuns.toLocaleString()} 次普通奖励，约 ${stamina.toLocaleString()} 体力`;
      }

      渲染记录();
    }

    function 处理回顶按钮() {
      if (window.scrollY > 220) el.backToTopBtn.classList.add('show');
      else el.backToTopBtn.classList.remove('show');
    }

    function 回到最上方() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.删除记录 = 删除记录;

    el.startBtn.addEventListener('click', 开始记录);
    el.addNormalBtn.addEventListener('click', () => 加分('normal'));
    el.addSpecialBtn.addEventListener('click', () => 加分('special'));
    el.resetAllBtn.addEventListener('click', 重置全部);
    el.openSettingsBtn.addEventListener('click', 打开设置);
    el.closeSettingsBtn.addEventListener('click', 关闭设置);
    el.backToTopBtn.addEventListener('click', 回到最上方);
    window.addEventListener('scroll', 处理回顶按钮);

    el.target.addEventListener('input', () => {
      state.target = Math.max(0, Number(el.target.value) || 0);
      保存状态();
      渲染();
    });

    el.initialCurrent.addEventListener('input', () => {
      state.initialCurrent = Math.max(0, Number(el.initialCurrent.value) || 0);
      保存状态();
      渲染();
    });

    填入设置值();
    渲染设置();
    渲染();
    处理回顶按钮();
  </script>
</body>
</html>

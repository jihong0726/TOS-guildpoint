<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>积宏工作台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #020617; color: #cbd5e1; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    .nav-btn { position: relative; padding: 0.5rem 1rem; font-size: 0.875rem; font-weight: 500; color: #94a3b8; transition: color 0.2s; }
    .nav-btn:hover { color: #f1f5f9; }
    .nav-btn.active { color: #3b82f6; }
    .nav-btn.active::after { content: ''; position: absolute; bottom: -16px; left: 0; right: 0; height: 2px; background-color: #3b82f6; border-radius: 2px 2px 0 0; }

    .page { display: none; animation: fadeIn 0.3s ease forwards; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .manage-actions { opacity: 0; transform: translateX(10px); pointer-events: none; transition: all 0.2s ease; display: flex; }
    body.manage-mode .manage-actions { opacity: 1; transform: translateX(0); pointer-events: auto; }
    body.manage-mode .tool-primary-action { opacity: 0.3; pointer-events: none; }

    .modal-mask { opacity: 0; visibility: hidden; pointer-events: none; transition: all 0.25s ease; backdrop-filter: blur(4px); }
    .modal-mask.show { opacity: 1; visibility: visible; pointer-events: auto; }
    .modal-content { transform: translateY(15px) scale(0.98); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .modal-mask.show .modal-content { transform: translateY(0) scale(1); }

    /* 全局 Toast 提示动画 */
    #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(51, 65, 85, 0.8); color: #f8fafc; padding: 10px 20px; border-radius: 8px; font-size: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); transform: translateY(-20px); opacity: 0; animation: toastIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; display: flex; items-center gap: 8px; }
    @keyframes toastIn { to { transform: translateY(0); opacity: 1; } }
    .toast.fade-out { animation: toastOut 0.3s ease forwards; }
    @keyframes toastOut { to { transform: translateY(-10px); opacity: 0; } }
  </style>
</head>
<body class="antialiased selection:bg-blue-500/30">

  <div id="toast-container"></div>

  <nav class="sticky top-0 z-40 w-full bg-[#020617]/80 backdrop-blur-md border-b border-slate-800/80">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-8">
        <span class="font-bold text-slate-100 text-lg tracking-wide flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-blue-500"></div>
          JiHong Hub
        </span>
        <div class="hidden md:flex gap-2">
          <button class="nav-btn active" data-page="home">总览</button>
          <button class="nav-btn" data-page="games">游戏区</button>
          <button class="nav-btn" data-page="exchange">交易台</button>
          <button class="nav-btn" data-page="calc">组件库</button>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button id="toggleManage" class="text-sm px-3 py-1.5 rounded-lg bg-slate-800/50 hover:bg-slate-800 text-slate-300 border border-slate-700/50 transition-colors flex items-center gap-2">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          <span id="manageText">管理模式</span>
        </button>
        <button id="openAddTool" class="text-sm px-4 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium transition-colors shadow-lg shadow-blue-500/20">
          + 新增
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-6 py-8">
    <section class="page active" id="page-home">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-slate-900/50 border border-slate-800/60 rounded-xl p-5">
          <div class="text-slate-500 text-xs font-semibold uppercase tracking-wider mb-2">活跃工具</div>
          <div class="text-3xl font-bold text-slate-100" id="statTools">0</div>
        </div>
        <div class="bg-slate-900/50 border border-slate-800/60 rounded-xl p-5">
          <div class="text-slate-500 text-xs font-semibold uppercase tracking-wider mb-2">已部署链接</div>
          <div class="text-3xl font-bold text-blue-400" id="statLinked">0</div>
        </div>
        <div class="bg-slate-900/50 border border-slate-800/60 rounded-xl p-5">
          <div class="text-slate-500 text-xs font-semibold uppercase tracking-wider mb-2">工作区</div>
          <div class="text-3xl font-bold text-slate-100">3</div>
        </div>
        <div class="bg-slate-900/50 border border-slate-800/60 rounded-xl p-5">
          <div class="text-slate-500 text-xs font-semibold uppercase tracking-wider mb-2">最近交互</div>
          <div class="text-3xl font-bold text-slate-100" id="statRecent">0</div>
        </div>
      </div>

      <div class="grid md:grid-cols-2 gap-8">
        <div class="space-y-8">
          <div>
            <h2 class="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2">星标置顶</h2>
            <div class="space-y-3" id="pinnedList"></div>
          </div>
          <div>
            <h2 class="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2">最近使用</h2>
            <div class="space-y-3" id="recentList"></div>
          </div>
        </div>
        <div>
           <h2 class="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2">工作区结构</h2>
            <div class="space-y-4">
               <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 hover:border-slate-700 transition-colors cursor-pointer" onclick="showPage('games')">
                  <div class="flex items-center justify-between mb-3"><h3 class="font-bold text-slate-100">游戏区</h3><span class="text-xs text-slate-500">点击进入 →</span></div>
                  <div class="text-sm text-slate-400" id="homeGamesPreview"></div>
               </div>
               <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 hover:border-slate-700 transition-colors cursor-pointer" onclick="showPage('exchange')">
                  <div class="flex items-center justify-between mb-3"><h3 class="font-bold text-slate-100">交易终端</h3><span class="text-xs text-slate-500">点击进入 →</span></div>
                  <div class="text-sm text-slate-400" id="homeExchangePreview"></div>
               </div>
               <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 hover:border-slate-700 transition-colors cursor-pointer" onclick="showPage('calc')">
                  <div class="flex items-center justify-between mb-3"><h3 class="font-bold text-slate-100">计算组件</h3><span class="text-xs text-slate-500">点击进入 →</span></div>
                  <div class="text-sm text-slate-400" id="homeCalcPreview"></div>
               </div>
            </div>
        </div>
      </div>
    </section>

    <template id="page-template">
      <div>
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
          <h1 class="text-2xl font-bold text-slate-100 flex items-center gap-3"><span class="page-title">标题</span></h1>
          <div class="flex items-center gap-3 w-full md:w-auto relative">
            <svg class="absolute left-3 top-2.5 text-slate-500 z-10" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" class="search-input w-full md:w-64 bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg pl-9 pr-12 py-2 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all outline-none" placeholder="检索工具..." />
            <div class="absolute right-2 top-2 text-[10px] font-mono text-slate-500 border border-slate-700 rounded px-1.5 py-0.5 bg-slate-800 pointer-events-none">⌘K</div>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 list-container"></div>
      </div>
    </template>

    <section class="page" id="page-games"></section>
    <section class="page" id="page-exchange"></section>
    <section class="page" id="page-calc"></section>
  </main>

  <div class="modal-mask fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80" id="toolModalMask">
    <div class="modal-content w-full max-w-lg bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800">
        <h2 class="text-lg font-bold text-slate-100" id="modalTitle">配置节点</h2>
        <button id="closeModal" class="text-slate-400 hover:text-white"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="p-6 space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">归属分区</label>
            <select id="toolCategory" class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2.5 outline-none focus:border-blue-500">
              <option value="games">游戏区</option><option value="exchange">交易终端</option><option value="calc">计算组件</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1.5">运行状态</label>
            <select id="toolStatus" class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2.5 outline-none focus:border-blue-500">
              <option value="已启用">已启用</option><option value="建设中">建设中</option><option value="预留">预留</option>
            </select>
          </div>
        </div>
        <div><label class="block text-xs font-semibold text-slate-500 mb-1.5">节点名称</label><input id="toolName" type="text" class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2.5 outline-none focus:border-blue-500" /></div>
        <div><label class="block text-xs font-semibold text-slate-500 mb-1.5">按钮文本</label><input id="toolButtonText" type="text" class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2.5 outline-none focus:border-blue-500" /></div>
        <div><label class="block text-xs font-semibold text-slate-500 mb-1.5">简介</label><input id="toolDesc" type="text" class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2.5 outline-none focus:border-blue-500" /></div>
        <div><label class="block text-xs font-semibold text-slate-500 mb-1.5">URL</label><input id="toolLink" type="text" class="w-full bg-slate-950 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2.5 outline-none font-mono focus:border-blue-500" placeholder="https://" /></div>
      </div>
      <div class="px-6 py-4 bg-slate-950/50 border-t border-slate-800 flex justify-end gap-3">
        <button id="clearDraft" class="text-sm px-4 py-2 text-slate-400">重置</button>
        <button id="saveTool" class="text-sm px-5 py-2 rounded-lg bg-blue-600 text-white font-medium">确认保存</button>
      </div>
    </div>
  </div>

  <script>
    const SVGS = {
      games: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4"/><path d="M8 10v4"/><path d="M15 13h.01"/><path d="M18 11h.01"/></svg>',
      exchange: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 9l-5 5-4-4-5 5"/></svg>',
      calc: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/></svg>',
      pin: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>',
      edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>',
      trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
      check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>'
    };

    const CONFIG = {
      pages: [
        { id: 'games', title: '游戏区', iconColor: 'text-emerald-400' },
        { id: 'exchange', title: '交易终端', iconColor: 'text-blue-400' },
        { id: 'calc', title: '计算组件', iconColor: 'text-amber-400' }
      ]
    };

    // 全局 Toast 系统
    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `${SVGS.check} <span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('fade-out');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    const template = document.getElementById('page-template').innerHTML;
    CONFIG.pages.forEach(p => {
      const el = document.getElementById(`page-${p.id}`);
      el.innerHTML = template;
      el.querySelector('.page-title').textContent = p.title;
      const input = el.querySelector('.search-input');
      
      // 搜索实时过滤
      input.addEventListener('input', () => {
        const keyword = input.value.trim().toLowerCase();
        el.querySelectorAll('.card-item').forEach(item => {
          item.style.display = (item.dataset.name || '').toLowerCase().includes(keyword) ? 'flex' : 'none';
        });
      });
      
      // 回车直接打开第一个匹配项 (Iteration 3 极客效率)
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const firstVisible = Array.from(el.querySelectorAll('.card-item')).find(item => item.style.display !== 'none');
          if (firstVisible) {
            const link = firstVisible.querySelector('a.tool-primary-action');
            if (link) link.click();
          }
        }
      });
    });

    let tools = JSON.parse(localStorage.getItem('jihong-tools-v4')) || [
      { id: 't1', category: 'games', name: '神魔之塔公会积分', desc: '记录积分与剩余体力', status: '已启用', link: '#', buttonText: '启动工具' }
    ];
    let recent = JSON.parse(localStorage.getItem('jihong-recent-v4')) || [];
    let pinned = JSON.parse(localStorage.getItem('jihong-pin-v4')) || [];
    let editingId = null;
    let isManageMode = false;

    const save = () => {
      localStorage.setItem('jihong-tools-v4', JSON.stringify(tools));
      localStorage.setItem('jihong-recent-v4', JSON.stringify(recent));
      localStorage.setItem('jihong-pin-v4', JSON.stringify(pinned));
    };

    // 路由控制与快捷键 (Cmd/Ctrl + K 聚焦搜索框)
    let currentPage = 'home';
    window.showPage = (name) => {
      currentPage = name;
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(`page-${name}`).classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.page === name));
      window.scrollTo(0, 0);
    };
    document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', () => showPage(btn.dataset.page)));

    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        if (currentPage === 'home') showPage('games'); // 若在首页，默认跳入第一个带有搜索框的子页
        setTimeout(() => document.querySelector(`#page-${currentPage === 'home' ? 'games' : currentPage} .search-input`).focus(), 50);
      }
    });

    document.getElementById('toggleManage').addEventListener('click', (e) => {
      isManageMode = !isManageMode;
      document.body.classList.toggle('manage-mode', isManageMode);
      e.currentTarget.classList.toggle('text-blue-400', isManageMode);
      document.getElementById('manageText').textContent = isManageMode ? '完成管理' : '管理模式';
      if (isManageMode) showToast("已开启管理模式");
    });

    window.pushRecent = (id) => {
      if(isManageMode) return;
      recent = [id, ...recent.filter(i => i !== id)].slice(0, 5);
      save(); render();
    };
    
    window.togglePin = (id) => {
      const isPinning = !pinned.includes(id);
      pinned = isPinning ? [id, ...pinned] : pinned.filter(i => i !== id);
      save(); render();
      showToast(isPinning ? "已加入星标置顶" : "已取消置顶");
    };
    
    window.delTool = (id) => {
      if(!confirm('确定移除此节点吗？')) return;
      tools = tools.filter(t => t.id !== id);
      recent = recent.filter(i => i !== id);
      pinned = pinned.filter(i => i !== id);
      save(); render();
      showToast("节点已移除");
    };

    // --- 核心修复区： target="_blank" ---
    const renderCard = (tool, compact = false) => {
      const isPin = pinned.includes(tool.id);
      const hasLink = !!tool.link;
      
      // 这里的 target="_blank" rel="noopener noreferrer" 解决了跳出回不来的问题
      if (compact) {
        return `<div class="flex items-center justify-between p-3 rounded-lg bg-slate-800/30 border border-slate-700/50 hover:bg-slate-800/60">
            <div class="flex items-center gap-3 truncate pr-4"><div class="text-slate-400">${SVGS[tool.category]}</div><div><div class="text-sm font-semibold text-slate-200">${tool.name}</div></div></div>
            ${hasLink ? `<a href="${tool.link}" target="_blank" rel="noopener noreferrer" onclick="pushRecent('${tool.id}')" class="text-xs px-3 py-1.5 rounded bg-blue-500/10 text-blue-400">打开</a>` : `<span class="text-xs text-slate-500">空</span>`}
          </div>`;
      }

      return `<div class="card-item relative bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col h-full" data-name="${tool.name}">
          <div class="flex justify-between items-start mb-3">
            <div class="flex items-center gap-3"><div class="p-2 bg-slate-800 rounded-lg ${CONFIG.pages.find(p=>p.id===tool.category).iconColor}">${SVGS[tool.category]}</div><h3 class="text-slate-100 font-semibold text-sm">${tool.name}</h3></div>
            <div class="manage-actions bg-slate-800/90 rounded-lg p-1 absolute top-4 right-4 z-10">
              <button onclick="togglePin('${tool.id}')" class="p-1.5 rounded hover:bg-slate-700 ${isPin?'text-amber-400':'text-slate-400'}">${SVGS.pin}</button>
              <button onclick="openModal('${tool.id}')" class="p-1.5 rounded hover:bg-slate-700 text-slate-400">${SVGS.edit}</button>
              <button onclick="delTool('${tool.id}')" class="p-1.5 rounded text-slate-400 hover:text-red-400">${SVGS.trash}</button>
            </div>
          </div>
          <p class="text-sm text-slate-400 mb-5 flex-grow">${tool.desc}</p>
          <div class="mt-auto border-t border-slate-800 pt-4 flex justify-between items-center">
            ${hasLink 
              ? `<a href="${tool.link}" target="_blank" rel="noopener noreferrer" onclick="pushRecent('${tool.id}')" class="tool-primary-action text-sm font-medium text-blue-400 flex items-center gap-1">${tool.buttonText || '启动服务'} →</a>` 
              : `<span class="tool-primary-action text-sm font-medium text-slate-600">暂无实例</span>`}
            ${isPin ? `<span class="text-amber-500/50">${SVGS.pin}</span>` : ''}
          </div>
        </div>`;
    };

    const render = () => {
      CONFIG.pages.forEach(p => {
        document.querySelector(`#page-${p.id} .list-container`).innerHTML = tools.filter(t => t.category === p.id).sort((a,b) => (pinned.includes(b.id)?1:0) - (pinned.includes(a.id)?1:0)).map(t => renderCard(t)).join('');
        const preEl = document.getElementById(`home${p.id.charAt(0).toUpperCase() + p.id.slice(1)}Preview`);
        const top2 = tools.filter(t => t.category === p.id).slice(0, 2);
        preEl.innerHTML = top2.length ? top2.map(t => `<div class="mt-2 truncate text-slate-300">${t.name}</div>`).join('') : '<div class="mt-2 text-slate-600 text-sm">空</div>';
      });

      document.getElementById('statTools').textContent = tools.length;
      document.getElementById('statLinked').textContent = tools.filter(t => !!t.link).length;
      document.getElementById('statRecent').textContent = recent.length;

      document.getElementById('pinnedList').innerHTML = pinned.map(id => tools.find(t => t.id === id)).filter(Boolean).map(t => renderCard(t, true)).join('');
      document.getElementById('recentList').innerHTML = recent.map(id => tools.find(t => t.id === id)).filter(Boolean).map(t => renderCard(t, true)).join('');
    };

    // 表单处理
    const mask = document.getElementById('toolModalMask');
    window.openModal = (idOrCat = 'games') => {
      if (typeof idOrCat === 'string' && tools.find(t => t.id === idOrCat)) {
        const t = tools.find(t => t.id === idOrCat);
        editingId = t.id;
        document.getElementById('toolCategory').value = t.category;
        document.getElementById('toolName').value = t.name;
        document.getElementById('toolDesc').value = t.desc;
        document.getElementById('toolLink').value = t.link || '';
        document.getElementById('toolButtonText').value = t.buttonText || '';
      } else {
        editingId = null;
        document.getElementById('toolName').value = document.getElementById('toolDesc').value = document.getElementById('toolLink').value = '';
      }
      mask.classList.add('show');
    };

    document.getElementById('closeModal').addEventListener('click', () => mask.classList.remove('show'));
    document.getElementById('openAddTool').addEventListener('click', () => openModal());
    
    document.getElementById('saveTool').addEventListener('click', () => {
      const name = document.getElementById('toolName').value.trim();
      const desc = document.getElementById('toolDesc').value.trim();
      if (!name || !desc) return;

      const data = { category: document.getElementById('toolCategory').value, status: document.getElementById('toolStatus').value, name, desc, link: document.getElementById('toolLink').value.trim(), buttonText: document.getElementById('toolButtonText').value.trim() };

      if (editingId) tools = tools.map(t => t.id === editingId ? { ...t, ...data } : t);
      else tools.unshift({ id: `t-${Date.now()}`, ...data });
      
      save(); render(); mask.classList.remove('show'); showPage(data.category);
      showToast(editingId ? "节点配置已更新" : "新节点已接入");
    });

    render();
  </script>
</body>
</html>

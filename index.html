<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>神魔之塔风格 公会任务分数计算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background:
        radial-gradient(circle at top, rgba(109, 40, 217, 0.20), transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(34, 197, 94, 0.10), transparent 25%),
        linear-gradient(180deg, #06070d 0%, #0b1020 45%, #111827 100%);
      color: white;
      min-height: 100vh;
    }

    .glass {
      border: 1px solid rgba(212, 175, 55, 0.26);
      background: linear-gradient(180deg, rgba(10, 12, 22, 0.92) 0%, rgba(17, 24, 39, 0.86) 100%);
      box-shadow: 0 18px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
    }

    .input {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(212, 175, 55, 0.22);
      background: rgba(5, 8, 18, 0.92);
      color: #f8fafc;
      padding: 12px 14px;
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .input:focus {
      border-color: rgba(245, 208, 94, 0.72);
      box-shadow: 0 0 0 3px rgba(245, 208, 94, 0.12);
    }

    .btn {
      border-radius: 14px;
      padding: 14px 16px;
      font-weight: 800;
      transition: 0.2s ease;
      border: 1px solid rgba(212,175,55,0.2);
      cursor: pointer;
      min-height: 54px;
      letter-spacing: 0.02em;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .btn-gold {
      background: linear-gradient(180deg, rgba(212,175,55,0.22) 0%, rgba(146, 103, 24, 0.18) 100%);
      color: #fef3c7;
      border-color: rgba(245, 208, 94, 0.30);
    }

    .btn-violet {
      background: linear-gradient(180deg, rgba(109, 40, 217, 0.28) 0%, rgba(67, 56, 202, 0.18) 100%);
      color: #ede9fe;
      border-color: rgba(167, 139, 250, 0.30);
    }

    .btn-blue {
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.22) 0%, rgba(30, 64, 175, 0.16) 100%);
      color: #dbeafe;
      border-color: rgba(96, 165, 250, 0.25);
    }

    .btn-red {
      background: linear-gradient(180deg, rgba(185, 28, 28, 0.24) 0%, rgba(127, 29, 29, 0.16) 100%);
      color: #fee2e2;
      border-color: rgba(252, 165, 165, 0.25);
      padding: 8px 12px;
      font-size: 14px;
      min-height: auto;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: rgba(212, 175, 55, 0.14);
      border: 1px solid rgba(245, 208, 94, 0.24);
      color: #f5d05e;
    }

    .progress-wrap {
      height: 16px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.95);
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.12);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #d4af37, #f5d05e, #8b5cf6);
      transition: width 0.3s ease;
      box-shadow: 0 0 18px rgba(212,175,55,0.25);
    }

    .record-card {
      border: 1px solid rgba(212,175,55,0.12);
      background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.02) 100%);
      border-radius: 18px;
      padding: 16px;
    }

    .ornament {
      position: relative;
    }

    .ornament::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 26px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(245,208,94,0.24), rgba(139,92,246,0.12), rgba(245,208,94,0.2));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="max-w-5xl mx-auto px-4 py-8 md:px-6 lg:px-8">
    <div class="mb-8 rounded-[28px] border border-yellow-500/20 bg-black/30 shadow-2xl overflow-hidden ornament">
      <div class="relative p-6 md:p-8">
        <div class="absolute inset-0 bg-[linear-gradient(135deg,rgba(251,191,36,0.10),transparent_45%,rgba(168,85,247,0.10))]"></div>
        <div class="relative">
          <div class="tag mb-3">Tower of Saviors Style</div>
          <h1 class="text-3xl md:text-5xl font-black text-yellow-100 tracking-wide">公会任务分数计算器</h1>
          <p class="mt-3 text-slate-200 text-sm md:text-base leading-7 max-w-3xl">
            先输入目前已有分数与目标分数，按开始后，用普通与特别两个按钮快速记录，并自动计算还需要多少体力。
          </p>
        </div>
      </div>
    </div>

    <div class="grid gap-6 lg:grid-cols-[1fr_1fr]">
      <section class="glass rounded-3xl p-5 md:p-6 ornament">
        <h2 class="text-xl font-bold text-yellow-100 mb-5">开始设定</h2>
        <div class="grid gap-4">
          <div>
            <label class="block text-sm font-semibold text-yellow-200/90 mb-2">目标分数</label>
            <input id="target" class="input" type="number" min="0" value="5000" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-yellow-200/90 mb-2">目前已有分数</label>
            <input id="initialCurrent" class="input" type="number" min="0" value="0" />
          </div>
          <div class="grid gap-4 md:grid-cols-2">
            <div>
              <label class="block text-sm font-semibold text-yellow-200/90 mb-2">普通任务分数</label>
              <input id="normalScore" class="input" type="number" min="1" value="40" />
            </div>
            <div>
              <label class="block text-sm font-semibold text-yellow-200/90 mb-2">特别任务分数</label>
              <input id="specialScore" class="input" type="number" min="1" value="200" />
            </div>
          </div>
        </div>

        <div class="mt-6 grid gap-3 sm:grid-cols-2">
          <button id="startBtn" class="btn btn-gold">开始</button>
          <button id="resetAllBtn" class="btn btn-blue">重置全部</button>
        </div>

        <div class="mt-6 rounded-3xl border border-yellow-400/10 bg-white/5 p-4 text-sm text-slate-300 leading-7">
          - 按开始后，会把目前已有分数当成起始分数保存下来<br>
          - 后续只要按普通或特别，就会自动加分并记录时间<br>
          - 每场体力固定 40，会自动计算还需要多少体力
        </div>
      </section>

      <section class="glass rounded-3xl p-5 md:p-6 ornament">
        <h2 class="text-xl font-bold text-yellow-100 mb-5">目前进度</h2>
        <div class="grid gap-4 sm:grid-cols-2">
          <div class="rounded-3xl border border-yellow-300/20 bg-yellow-400/10 p-4">
            <div class="text-sm text-yellow-100/80">目前总分</div>
            <div id="currentDisplay" class="mt-2 text-3xl font-black text-yellow-50">0</div>
          </div>
          <div class="rounded-3xl border border-cyan-300/20 bg-cyan-400/10 p-4">
            <div class="text-sm text-cyan-100/80">距离目标</div>
            <div id="remainingDisplay" class="mt-2 text-3xl font-black text-cyan-50">0</div>
          </div>
          <div class="rounded-3xl border border-violet-300/20 bg-violet-400/10 p-4 sm:col-span-2">
            <div class="text-sm text-violet-100/80">尚需体力</div>
            <div id="staminaDisplay" class="mt-2 text-3xl font-black text-violet-50">0</div>
          </div>
        </div>

        <div class="mt-5">
          <div class="mb-2 flex items-center justify-between text-sm text-slate-200">
            <span>完成进度</span>
            <span id="progressText">0%</span>
          </div>
          <div class="progress-wrap">
            <div id="progressBar" class="progress-bar"></div>
          </div>
          <div id="statusText" class="mt-3 text-sm text-slate-300"></div>
        </div>

        <div class="mt-6">
          <h3 class="text-lg font-bold text-yellow-100 mb-3">快速记录</h3>
          <div class="grid gap-3 sm:grid-cols-2">
            <button id="addNormalBtn" class="btn btn-gold">普通 +40</button>
            <button id="addSpecialBtn" class="btn btn-violet">特别 +200</button>
          </div>
        </div>
      </section>
    </div>

    <section class="glass rounded-3xl p-5 md:p-6 mt-6 ornament">
      <div class="mb-4 flex items-center justify-between gap-3">
        <h2 class="text-xl font-bold text-yellow-100">分数记录历史</h2>
        <div id="historyCount" class="text-sm text-slate-300">共 0 笔记录</div>
      </div>
      <div id="historyWrap"></div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = 'tos-guild-score-tracker-v3';

    const el = {
      target: document.getElementById('target'),
      initialCurrent: document.getElementById('initialCurrent'),
      normalScore: document.getElementById('normalScore'),
      specialScore: document.getElementById('specialScore'),
      currentDisplay: document.getElementById('currentDisplay'),
      remainingDisplay: document.getElementById('remainingDisplay'),
      progressText: document.getElementById('progressText'),
      progressBar: document.getElementById('progressBar'),
      statusText: document.getElementById('statusText'),
      addNormalBtn: document.getElementById('addNormalBtn'),
      addSpecialBtn: document.getElementById('addSpecialBtn'),
      startBtn: document.getElementById('startBtn'),
      resetAllBtn: document.getElementById('resetAllBtn'),
      historyCount: document.getElementById('historyCount'),
      historyWrap: document.getElementById('historyWrap')
    };

    let state = loadState();

    function defaultState() {
      return {
        target: 5000,
        initialCurrent: 0,
        normalScore: 40,
        specialScore: 200,
        started: false,
        history: []
      };
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return defaultState();
        return { ...defaultState(), ...JSON.parse(saved) };
      } catch {
        return defaultState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function nowText() {
      const d = new Date();
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

        function getExtraScore() {
      return state.history.reduce((sum, item) => sum + Number(item.score || 0), 0);
    }

    function getCurrentTotal() {
      return Number(state.initialCurrent || 0) + getExtraScore();
    }

    function syncButtons() {
      el.addNormalBtn.textContent = `普通 +${Number(state.normalScore || 40)}`;
      el.addSpecialBtn.textContent = `特别 +${Number(state.specialScore || 200)}`;
    }

    function startTracking() {
      state.target = Math.max(0, Number(el.target.value) || 0);
      state.initialCurrent = Math.max(0, Number(el.initialCurrent.value) || 0);
      state.normalScore = Math.max(1, Number(el.normalScore.value) || 40);
      state.specialScore = Math.max(1, Number(el.specialScore.value) || 200);
      state.started = true;
      saveState();
      syncButtons();
      render();
      alert('已开始记录');
    }

    function addScore(type) {
      if (!state.started) {
        alert('请先输入目前分数后按开始');
        return;
      }

      const score = type === 'normal' ? Number(state.normalScore || 40) : Number(state.specialScore || 200);
      const label = type === 'normal' ? '普通任务' : '特别任务';

      state.history.unshift({
        id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        time: nowText(),
        type,
        typeLabel: label,
        score,
        note: ''
      });

      saveState();
      render();
    }

    function deleteLog(id) {
      state.history = state.history.filter(item => item.id !== id);
      saveState();
      render();
    }

    function resetAll() {
      if (!confirm('确定要重置全部资料吗？')) return;
      state = defaultState();
      saveState();
      fillInputs();
      syncButtons();
      render();
    }

    function fillInputs() {
      el.target.value = state.target;
      el.initialCurrent.value = state.initialCurrent;
      el.normalScore.value = state.normalScore;
      el.specialScore.value = state.specialScore;
    }

    function renderHistory() {
      el.historyCount.textContent = `共 ${state.history.length} 笔记录`;

      if (!state.history.length) {
        el.historyWrap.innerHTML = `
          <div class="rounded-3xl border border-dashed border-white/15 bg-white/5 p-6 text-sm text-slate-300">
            目前还没有记录。按开始后，只要点普通或特别按钮就会自动记录。
          </div>
        `;
        return;
      }

      el.historyWrap.innerHTML = state.history.map((item, index) => `
        <div class="record-card mb-3">
          <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
            <div>
              <div class="text-sm text-slate-400">#${state.history.length - index} ・ ${item.time}</div>
              <div class="mt-1 text-lg font-bold text-yellow-100">+${item.score} 分 ・ ${item.typeLabel}</div>
              <div class="mt-1 text-sm text-slate-300">已记录</div>
            </div>
            <button class="btn btn-red" onclick="deleteLog('${item.id}')">删除</button>
          </div>
        </div>
      `).join('');
    }

    function render() {
      const current = getCurrentTotal();
      const target = Math.max(0, Number(state.target) || 0);
      const remaining = Math.max(0, target - current);
      const progress = target === 0 ? 100 : Math.min(100, (current / target) * 100);
      const normal = Math.max(1, Number(state.normalScore) || 40);
      const special = Math.max(1, Number(state.specialScore) || 200);
      const bestRuns = remaining === 0 ? 0 : Math.ceil(remaining / Math.max(normal, special));
      const stamina = bestRuns * 40;

      el.currentDisplay.textContent = current.toLocaleString();
      el.remainingDisplay.textContent = remaining.toLocaleString();
      document.getElementById('staminaDisplay').textContent = stamina.toLocaleString();
      el.progressText.textContent = `${progress.toFixed(1)}%`;
      el.progressBar.style.width = `${progress}%`;

      if (!state.started) {
        el.statusText.textContent = '请先输入目前已有分数，然后按开始。';
      } else if (current >= target) {
        el.statusText.textContent = `已达标，目前 ${current.toLocaleString()} 分。`;
      } else {
        el.statusText.textContent = `距离目标还差 ${remaining.toLocaleString()} 分，若优先打高分关卡，约还需要 ${stamina.toLocaleString()} 体力。`;
      }

      renderHistory();
    }

    window.deleteLog = deleteLog;

    el.startBtn.addEventListener('click', startTracking);
    el.addNormalBtn.addEventListener('click', () => addScore('normal'));
    el.addSpecialBtn.addEventListener('click', () => addScore('special'));
    el.resetAllBtn.addEventListener('click', resetAll);

    
    el.target.addEventListener('input', () => {
      state.target = Math.max(0, Number(el.target.value) || 0);
      saveState();
      render();
    });

    el.normalScore.addEventListener('input', () => {
      state.normalScore = Math.max(1, Number(el.normalScore.value) || 40);
      saveState();
      syncButtons();
      render();
    });

    el.specialScore.addEventListener('input', () => {
      state.specialScore = Math.max(1, Number(el.specialScore.value) || 200);
      saveState();
      syncButtons();
      render();
    });

    fillInputs();
    syncButtons();
    render();
  </script>
</body>
</html>
